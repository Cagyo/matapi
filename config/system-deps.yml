# System packages installed at install time keyed by feature.
# Read by scripts/install.sh.

# Desired Node.js major version. `/system_update` applies allowlisted apt updates
# automatically and reports Node major mismatches with manual upgrade
# instructions (spec 18 / spec 24).
node: "22"

core:
  apt:
    - git
    - sqlite3
    - libsqlite3-dev
    - build-essential
    - python3
    - python3-setuptools

digital:
  apt:
    - gpiod

motion:
  apt:
    - motion
    - ffmpeg

# Explicit opt-in for the restricted RTSP converter and Quick Tunnel view.
rtsp:
  apt:
    - ffmpeg
    - nftables
    - policykit-1
    - cloudflared

uart:
  raspi-config:
    - "do_serial_cons 1"
    - "do_serial_hw 0"

zigbee:
  apt:
    - mosquitto
    - mosquitto-clients

cellular:
  apt:
    - usb-modeswitch
